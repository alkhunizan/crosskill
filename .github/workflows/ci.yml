name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin so setup-bun doesn't need to call the GH API for tag lookup —
          # that path returned 401 during the v0.4.2 release run.
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install
      # Build @crosskill/core first so its dist/node.d.ts exists when the
      # CLI typechecks (the CLI imports from @crosskill/core/node, and
      # `tsc` resolves that via the published .d.ts files).
      - run: bun run --filter '@crosskill/core' build
      - run: bun run typecheck
      - run: bun test
      - run: bun run --filter 'crosskill' build
      - name: Smoke test the CLI
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          node $GITHUB_WORKSPACE/packages/cli/dist/cli.js init
          node $GITHUB_WORKSPACE/packages/cli/dist/cli.js build
          node $GITHUB_WORKSPACE/packages/cli/dist/cli.js lint
          test -f .claude/skills/code-reviewer/SKILL.md
          test -f .cursor/rules/code-reviewer.mdc
          test -f AGENTS.md
          test -f crosskill.lock
          node $GITHUB_WORKSPACE/packages/cli/dist/cli.js check
          node $GITHUB_WORKSPACE/packages/cli/dist/cli.js test -u
          node $GITHUB_WORKSPACE/packages/cli/dist/cli.js test
      - name: Validate composite action.yml
        run: |
          node -e "
            const yaml = require('node:fs').readFileSync('.github/actions/crosskill/action.yml', 'utf8');
            // Cheap structural assertions; full schema validation happens server-side when used.
            for (const f of ['name:', 'description:', 'runs:', 'using: composite', 'inputs:', 'mode:', 'version:']) {
              if (!yaml.includes(f)) { console.error('action.yml missing:', f); process.exit(1); }
            }
            console.log('action.yml OK');
          "
