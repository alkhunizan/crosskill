name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Smoke test the CLI
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          node $GITHUB_WORKSPACE/dist/cli.js init
          node $GITHUB_WORKSPACE/dist/cli.js build
          node $GITHUB_WORKSPACE/dist/cli.js lint
          test -f .claude/skills/code-reviewer/SKILL.md
          test -f .cursor/rules/code-reviewer.mdc
          test -f AGENTS.md
